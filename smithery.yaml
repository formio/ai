# Smithery configuration for @formio/mcp — https://smithery.ai/docs
#
# The server speaks stdio: the client spawns it and owns stdin/stdout. It starts
# with no configuration at all, so nothing below is required — but every tool that
# touches Form.io data needs FORMIO_PROJECT_URL, so a useful install sets it.
#
# FORMIO_API_KEY is optional but recommended here. Without it the server falls
# back to a browser login flow, which cannot complete in a hosted or headless
# environment — see "Headless environments" in packages/mcp-server/README.md.
startCommand:
  type: stdio
  configSchema:
    type: object
    # Nothing is required: the server starts with no configuration at all and
    # serves its full tool list, and the tools that need a project raise an
    # actionable error when called without one.
    properties:
      formioProjectUrl:
        type: string
        title: Project URL
        description: >-
          Full URL of your Form.io project, e.g. https://myproject.form.io or
          https://forms.example.com/myproject. Needed by every tool that reads or
          writes Form.io data; leave it blank only to look around first.
      formioBaseUrl:
        type: string
        title: Base URL (only if it cannot be derived)
        description: >-
          Base URL of the deployment. Usually leave it blank: it is derived from the
          project URL — https://api.form.io for a project on a form.io host, the
          parent path for a sub-directory-routed one. Set it only when your project
          URL is a plain sub-domain of your own domain, whose deployment is a sibling
          sub-domain nothing in the project URL names. Defaulting it to api.form.io
          would send a self-hosted login to a deployment you do not use.
      formioApiKey:
        type: string
        title: Project API key
        description: >-
          Project API key. Recommended: without it the server attempts an
          interactive browser login, which cannot complete without a desktop
          browser on the same machine.
      formioInsecureTls:
        type: boolean
        default: false
        title: Skip TLS verification
        description: >-
          Local development only. Needed when a self-hosted deployment uses a
          self-signed certificate, which Node cannot trust via a CA bundle.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@formio/mcp'],
      env: Object.assign(
        { FORMIO_PROJECT_URL: config.formioProjectUrl },
        config.formioBaseUrl ? { FORMIO_BASE_URL: config.formioBaseUrl } : {},
        config.formioApiKey ? { FORMIO_API_KEY: config.formioApiKey } : {},
        config.formioInsecureTls ? { FORMIO_INSECURE_TLS: '1' } : {}
      ),
    })
  exampleConfig:
    formioProjectUrl: https://myproject.form.io
    formioApiKey: your-api-key
