name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-changeset:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the image jobs below, which run on their own runners and so
      # cannot see this job's step outputs.
      image_version: ${{ steps.dockerhub.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
      # Required for npm Trusted Publishing (OIDC). Without it npm auth fails
      # with a misleading 404 on PUT rather than a 401.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.x,
      # and `pnpm publish` delegates the upload to the npm CLI.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # No NODE_AUTH_TOKEN: OIDC supplies short-lived credentials, and leaving a
      # token in the environment makes npm prefer it and skip Trusted Publishing.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset:version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ### Publish the MCP server to the official MCP Registry.
      # Deliberately does NOT gate on changesets/action's `published` output:
      # that output is only populated when the action can parse `changeset
      # publish` output, and this repo publishes via a custom `pnpm -r publish`,
      # so it stays empty even on a successful release.
      #
      # Instead, compare the three sources of truth directly. Publish only when
      # npm already has this version (the registry verifies ownership by reading
      # "mcpName" from the tarball, so npm must land first) and the registry does
      # not. That makes the step idempotent and safe to re-run.
      - name: Resolve the released @formio/mcp version
        id: pkg
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version packages/mcp-server/package.json)
          echo "name=$(jq -r .mcpName packages/mcp-server/package.json)" >> "$GITHUB_OUTPUT"

          # Retry: npm's read path lags its write path by a few seconds, so a
          # lookup immediately after a successful publish in this same job can
          # still 404. Without this the registry and image publishes silently
          # skipped a version that had in fact just been released.
          for attempt in 1 2 3 4 5 6; do
            if npm view "@formio/mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "npm has @formio/mcp@${VERSION} (attempt ${attempt})."
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "npm has not surfaced @formio/mcp@${VERSION} yet (attempt ${attempt}); waiting…"
            sleep 10
          done

          echo "npm still does not have @formio/mcp@${VERSION} after 60s — skipping downstream publishes."

      - name: Decide whether to publish to the MCP Registry
        id: mcp
        if: steps.pkg.outputs.version != ''
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          NAME='${{ steps.pkg.outputs.name }}'
          PUBLISHED=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}" \
            | jq -r --arg n "$NAME" '[.servers[]? | select(.server.name == $n) | .server.version] | max // ""')
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Registry already has ${NAME}@${VERSION} — skipping."
          else
            echo "Publishing ${NAME}@${VERSION} (registry currently at '${PUBLISHED:-none}')."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.mcp.outputs.version != ''
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set version in server.json
        if: steps.mcp.outputs.version != ''
        run: |
          jq --arg v "${{ steps.mcp.outputs.version }}" \
            '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        if: steps.mcp.outputs.version != ''
        run: ./mcp-publisher login dns --domain form.io --private-key ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Publish server to MCP Registry
        if: steps.mcp.outputs.version != ''
        run: ./mcp-publisher publish

      ### Publish the desktop bundle (.mcpb) and the GitHub release that carries it.
      # An .mcpb is the one-click install path for desktop hosts such as Claude
      # Desktop: no npm, no CLI, no hand-edited JSON. It is also the artifact the
      # Smithery CLI can publish, since that accepts a URL or a bundle but not a
      # stdio npm package.
      #
      # This repo has no tags or GitHub releases — `pnpm release` is a custom
      # publish, so changesets/action never creates them — hence the release is
      # created here, and the bundle attached to it.
      - name: Build the .mcpb bundle
        if: steps.pkg.outputs.version != ''
        run: pnpm build:mcpb

      - name: Create the GitHub release and attach the bundle
        if: steps.pkg.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — replacing the bundle asset."
            gh release upload "$TAG" dist/formio-mcp.mcpb --clobber
          else
            gh release create "$TAG" dist/formio-mcp.mcpb \
              --title "@formio/mcp ${VERSION}" \
              --notes "Install with \`npx -y @formio/mcp\`, \`docker run formio/mcp\`, or download the attached \`.mcpb\` for one-click installation in Claude Desktop." \
              --target "${GITHUB_SHA}"
          fi

      # Smithery lists the bundle under the formio namespace. Skips cleanly when the
      # token is absent, matching the Docker Hub step, so forks and unconfigured
      # repos still release successfully.
      #
      # Publishes the .smithery.mcpb variant, not the one attached to the GitHub
      # release: Smithery validates manifest.tools against the MCP Tool type and
      # rejects entries with no inputSchema, which is more than the MCPB schema
      # permits. See scripts/build-mcpb.ts.
      - name: Publish the bundle to Smithery
        if: steps.pkg.outputs.version != ''
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "SMITHERY_API_KEY is not configured — skipping the Smithery publish."
            exit 0
          fi
          npx -y @smithery/cli@latest mcp publish ./dist/formio-mcp.smithery.mcpb -n formio/mcp

      ### Decide whether the container image needs publishing.
      # Same idempotent shape as the registry publish: only when npm already has
      # the version and Docker Hub does not. Skips cleanly when credentials are absent
      # so a release in a fork or an unconfigured repo still succeeds.
      #
      # The decision lives here, in the job that knows the released version; the
      # build itself runs in docker-image below, on one runner per architecture.
      # Keeping it a separate job is what stops an image failure from touching the
      # npm, registry, bundle and Smithery publishes above — it used to sit in this
      # job, where a single QEMU crash silently withheld the .mcpb, the GitHub
      # release and the Smithery publish. Each channel is independent, so an image
      # failure now costs only the image.
      - name: Decide whether to publish to Docker Hub
        id: dockerhub
        if: steps.pkg.outputs.version != ''
        # Credentials are read through env rather than referenced in `if:` — the
        # secrets context is not dependable in step conditionals, and this also
        # keeps them out of the interpolated command line.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Docker Hub credentials are not configured — skipping the image publish."
            exit 0
          fi

          VERSION='${{ steps.pkg.outputs.version }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/formio/mcp/tags/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "Docker Hub already has formio/mcp:${VERSION} — skipping."
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  ### Build the container image, one architecture per native runner.
  # arm64 as well as amd64: a large share of developers run Apple Silicon, where an
  # amd64-only image is emulated and noticeably slower to start.
  #
  # Emulation is exactly what this job exists to avoid. Building both platforms in
  # one step meant arm64 ran under QEMU, where `npm install` died with SIGILL
  # (exit 132) on two of three releases — leaving Docker Hub a version behind while
  # every other channel was current. GitHub's ARM runners are free for public
  # repositories, so each architecture builds on its own hardware and no QEMU is
  # involved at all.
  #
  # Each build pushes an untagged manifest by digest; docker-manifest joins them
  # into the tags people actually pull.
  docker-image:
    needs: plugin-changeset
    if: needs.plugin-changeset.outputs.image_version != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing should not cancel the other: with fail-fast the
      # surviving digest would be discarded and a re-run would rebuild both.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # provenance is off deliberately. With push-by-digest an attestation turns the
      # pushed digest into an index rather than a single-platform manifest, which is
      # not what imagetools expects to combine.
      - name: Build and push formio/mcp by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/mcp-server
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=formio/mcp,push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo '${{ steps.build.outputs.digest }}' > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          # A silently missing digest would produce a half-built manifest below.
          if-no-files-found: error
          retention-days: 1

  ### Join the per-architecture digests into the published tags.
  docker-manifest:
    needs: [plugin-changeset, docker-image]
    if: needs.plugin-changeset.outputs.image_version != ''
    runs-on: ubuntu-latest
    steps:
      # Checked out for packages/mcp-server/DOCKERHUB.md, read by the overview sync.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-architecture tags
        env:
          VERSION: ${{ needs.plugin-changeset.outputs.image_version }}
        run: |
          set -euo pipefail

          # Refuse to publish a tag covering fewer architectures than intended: an
          # image quietly missing arm64 is worse than a failed release, because it
          # looks fine until someone on Apple Silicon pulls it.
          COUNT=$(ls -1 /tmp/digests | wc -l | tr -d ' ')
          if [ "$COUNT" != "2" ]; then
            echo "Expected 2 digests (amd64, arm64), found ${COUNT}:"
            ls -l /tmp/digests
            exit 1
          fi

          REFS=$(for f in /tmp/digests/*; do printf 'formio/mcp@%s ' "$(cat "$f")"; done)
          echo "Combining: ${REFS}"

          # Retried: this is a pure registry operation, and it fails independently
          # of the builds that produced the digests.
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              --tag "formio/mcp:${VERSION}" \
              --tag formio/mcp:latest \
              ${REFS}; then
              echo "Tags published on attempt ${attempt}."
              docker buildx imagetools inspect "formio/mcp:${VERSION}"
              exit 0
            fi
            echo "imagetools create failed (attempt ${attempt}); retrying in 15s…"
            sleep 15
          done

          echo "Could not publish the tags after 3 attempts."
          exit 1

      # Docker Hub full-text searches the overview, and it does not sync itself.
      # Kept in its own file rather than reusing the README, whose relative links
      # would all break once rendered on Docker Hub.
      #
      # Requires an account password: Docker Hub's description endpoint answers
      # 403 to a personal access token, however broadly scoped. Gated on an
      # optional DOCKERHUB_PASSWORD so a docs sync can never fail a release — the
      # image is already pushed by this point. Without it, edit the overview by
      # hand from packages/mcp-server/DOCKERHUB.md.
      - name: Check for Docker Hub description credentials
        id: hubdesc
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "${DOCKERHUB_PASSWORD:-}" ]; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No DOCKERHUB_PASSWORD — skipping the overview sync (the image published fine)."
          fi

      - name: Sync the Docker Hub overview
        if: steps.hubdesc.outputs.enabled == 'yes'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: formio/mcp
          readme-filepath: packages/mcp-server/DOCKERHUB.md
